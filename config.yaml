# =============================================================================
# Manufacturing QC Agent Configuration
# =============================================================================
# Non-sensitive settings. Secrets go in .env

# Agent Identity
AGENT_NAME: Manufacturing QC Agent
AGENT_DESCRIPTION: AI agent for solar module defect detection and process optimization

# LLM Configuration
DEFAULT_LLM_MODEL: gemini/gemini-2.5-pro
DEFAULT_VISION_MODEL: gemini/gemini-2.5-pro
RECOMMENDATION_LLM_MODEL: gemini/gemini-2.5-flash
LLM_TEMPERATURE: 0.1
LLM_MAX_TOKENS: 4096

# Defect Detection Settings
CONFIDENCE_THRESHOLD: 0.5
FALSE_POSITIVE_TARGET: 0.05

# Defect Categories (PVEL-AD - 12 classes matching trained model)
DEFECT_CATEGORIES:
  - black_core
  - corner
  - crack
  - finger
  - fragment
  - horizontal_dislocation
  - printing_error
  - scratch
  - short_circuit
  - star_crack
  - thick_line
  - vertical_dislocation

# External Services (optional)
MODEL_PATH: best.pt
RGB_MODEL_PATH: pv_defect_efficientnet_b0_97.pth.zip

# RGB Surface Categories (EfficientNet - 6 classes)
SURFACE_CATEGORIES:
  - Bird-drop
  - Clean
  - Dusty
  - Electrical-damage
  - Physical-Damage
  - Snow-Covered

# Field Units Mapping for Anomaly Detection
# Maps field names (case-insensitive) to their units
# Verified against solar panel manufacturing industry standards
FIELD_UNITS:
  # Temperature (industry standard: °C for lamination 140-150°C)
  temperature: "°C"
  temp: "°C"
  cell_temperature: "°C"
  ambient_temperature: "°C"
  lamination_temperature: "°C"
  soldering_temperature: "°C"
  
  # Pressure (industry standard: bar for lamination ~1 bar)
  pressure: "bar"
  vacuum_pressure: "mbar"
  lamination_pressure: "bar"
  
  # Electrical (STC testing standards)
  voltage: "V"
  voc: "V"                    # Open-circuit voltage
  vmp: "V"                    # Max power voltage
  current: "A"
  isc: "A"                    # Short-circuit current
  imp: "A"                    # Max power current
  power: "W"
  pmax: "Wp"                  # Peak watts
  irradiance: "W/m²"          # Standard: 1000 W/m² at STC
  
  # Speed/Rate
  speed: "m/min"
  line_speed: "m/min"
  flow_rate: "L/min"
  
  # Dimensions
  thickness: "mm"
  width: "mm"
  length: "mm"
  
  # Environmental
  humidity: "%"
  moisture: "%"
  
  # Time (lamination dwell time: 20-35 min typical)
  cycle_time: "s"
  dwell_time: "min"
  curing_time: "min"


